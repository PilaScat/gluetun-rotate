[project]
name = "gluetun-rotate"
version = "0.2.0"
description = "Moves Gluetun to another VPN server when the IPTV provider refuses the current exit address."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["scratch_*", ".venv", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = "^(tests|scripts)/"

[tool.pytest.ini_options]
testpaths = ["tests"]
