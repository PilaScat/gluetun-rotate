name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Tests
        run: python -m pytest
      - name: Types
        run: python -m mypy .
      - name: Lint
        run: python -m ruff check .
      - name: Build
        run: python scripts/build_zip.py
